# Lowered from the Flutter template's default -Xmx8G: this machine has 7GB
# of RAM total, so an 8GB heap request for the Gradle daemon ALONE cannot
# succeed and crashed the daemon outright ("Native memory allocation (mmap)
# failed", hs_err_pid7340.log) — confirmed live, not a guess. 1536m is
# enough for this app's small dependency set while leaving room for an
# emulator and the rest of the toolchain running alongside it.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
